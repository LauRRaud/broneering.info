# Server staging template, separate from local compose.yaml. See docs/SERVER.md.
services:
  db:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking_owner
      POSTGRES_DB: booking
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
    volumes:
      - server_database:/var/lib/postgresql
      - ./infra/server-init.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_owner -d booking"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      target: migration
    environment:
      MIGRATION_DATABASE_URL: postgresql://booking_owner:${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}@db:5432/booking
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]
  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://booking_app:${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}@db:5432/booking
      AUTH_BASE_URL: https://haldus.broneering.info
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_MAIL_MODE: ${AUTH_MAIL_MODE:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@broneering.info}
    ports:
      - "127.0.0.1:${WEB_PORT:-3107}:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  server_database:
