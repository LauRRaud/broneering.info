services:
  db:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    cpus: 0.75
    mem_limit: 512m
    environment:
      POSTGRES_USER: booking_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
    volumes:
      - database:/var/lib/postgresql
      - ${TEST_ROOT:?}/infra/server-init.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    ports: ["127.0.0.1:55436:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_owner -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    image: ${WEB_IMAGE:?}
    cpus: 1.25
    mem_limit: 768m
    environment:
      DATABASE_URL: postgresql://booking_app:${DB_APP_PASSWORD:?}@db:5432/${DB_NAME:?}
      AUTH_BASE_URL: https://haldus.localhost:3443
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_MAIL_MODE: disabled
      BOOKING_MAIL_MODE: disabled
      BILLING_MAIL_MODE: disabled
      MAKECOMMERCE_MODE: disabled
      PRIVATE_STORAGE_DIR: /data/private
    volumes: ["private_files:/data/private"]
    ports: ["127.0.0.1:3109:3000"]
    depends_on:
      db:
        condition: service_healthy
  tools:
    image: ${TOOLS_IMAGE:?}
    profiles: [tools]
    network_mode: host
    user: "1001:1001"
    environment:
      CHAPTER26_ISOLATED: "1"
      DATABASE_URL: postgresql://booking_app:${DB_APP_PASSWORD:?}@127.0.0.1:55436/${DB_NAME:?}
      MIGRATION_DATABASE_URL: postgresql://booking_owner:${DB_OWNER_PASSWORD:?}@127.0.0.1:55436/${DB_NAME:?}
      AUTH_BASE_URL: https://haldus.localhost:3443
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_MAIL_MODE: disabled
      BOOKING_MAIL_MODE: disabled
      BILLING_MAIL_MODE: disabled
      MAKECOMMERCE_MODE: disabled
      PRIVATE_STORAGE_DIR: /data/private
    volumes:
      - ${TEST_ROOT:?}/src:/app/src:ro
      - ${TEST_ROOT:?}/scripts:/app/scripts:ro
      - ${TEST_ROOT:?}/db:/app/db:ro
      - ${TEST_ROOT:?}/tsconfig.json:/app/tsconfig.json:ro
      - ${TEST_ROOT:?}/output:/app/output
      - private_files:/data/private
    command: ["node", "--import", "tsx", "scripts/chapter26-fixture.ts", "proof"]
volumes:
  database:
    labels:
      booking.acceptance: ${COMPOSE_PROJECT_NAME:?}
  private_files:
    labels:
      booking.acceptance: ${COMPOSE_PROJECT_NAME:?}
