# Initial ACME validation only; replaced by nginx.conf after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name broneering.info www.broneering.info haldus.broneering.info demo.broneering.info demo2.broneering.info;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/broneering-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503 'Broneering.info paigaldamine on pooleli.\n'; }
}
