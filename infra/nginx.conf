# Included by nginx in its http context. Only this project's hosts use these limits.
limit_req_zone $binary_remote_addr zone=broneering_api:10m rate=5r/s;

# Wildcard DNS reaches this challenge-only host until its own HTTPS certificate is ready.
server {
    listen 80;
    listen [::]:80;
    server_name *.broneering.info;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/broneering-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name broneering.info www.broneering.info haldus.broneering.info demo.broneering.info demo2.broneering.info;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/broneering-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name broneering.info www.broneering.info haldus.broneering.info demo.broneering.info demo2.broneering.info;
    ssl_certificate /etc/letsencrypt/live/broneering.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/broneering.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:broneering_ssl:1m;
    client_max_body_size 16k;
    access_log /var/log/nginx/broneering.access.log;
    error_log /var/log/nginx/broneering.error.log warn;
    # Redirect only the product homepage. Keep widget, API and tenant hosts here.
    location = / {
        if ($host ~ ^(www\.)?broneering\.info$) { return 302 https://ajasta.ee/$is_args$args; }
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    # Raw CSV upload: match CSV_MAX_BYTES while retaining the ordinary API limit.
    location = /api/admin/imports {
        client_max_body_size 5m;
        limit_req zone=broneering_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    # Image uploads only; ordinary JSON endpoints retain the 16k limit.
    location = /api/admin/theme-logo {
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        limit_req zone=broneering_api burst=10 nodelay;
        limit_req_status 429;
        proxy_read_timeout 30s;
    }

    location = /api/admin/staff-photo {
        client_max_body_size 10m;
        limit_req zone=broneering_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location /api/ {
        limit_req zone=broneering_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
