# Install after the ajasta.ee certificate has been issued using the shared webroot.
server {
    listen 80;
    listen [::]:80;
    server_name ajasta.ee www.ajasta.ee;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/broneering-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://ajasta.ee$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ajasta.ee www.ajasta.ee;
    ssl_certificate /etc/letsencrypt/live/ajasta.ee/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ajasta.ee/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ajasta_ssl:1m;
    client_max_body_size 16k;
    access_log /var/log/nginx/ajasta.access.log;
    error_log /var/log/nginx/ajasta.error.log warn;
    if ($host = www.ajasta.ee) { return 302 https://ajasta.ee$request_uri; }
    # Ajasta serves the product website; booking and administration use their own hosts.
    location /api/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
